name: Add Ask AI to portfolio pages

on:
  push:
    paths:
      - '.github/workflows/add-chat-widget.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-widget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add shared Ask AI widget to subpages
        run: |
          python3 - <<'PY'
          from pathlib import Path

          tag = '  <script src="chat-widget.js" defer></script>\n'
          for path in Path('web_deployment').glob('*.html'):
              # Keep the print-focused CV clean; Ask AI belongs on normal site pages.
              if path.name == 'cv.html':
                  continue
              text = path.read_text()
              if 'chat-widget.js' in text:
                  continue
              if '</body>' not in text:
                  continue
              text = text.replace('</body>', tag + '</body>', 1)
              path.write_text(text)
              print('Updated', path)
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web_deployment/*.html
          git commit -m "Enable Ask AI on portfolio pages"
          git push
